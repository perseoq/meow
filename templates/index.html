<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #202124;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .logo {
            margin-bottom: 30px;
            max-height: 120px;
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 30px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
        }
        .search-input:hover, 
        .search-input:focus {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }
        .search-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .search-button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        .search-button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .info-message {
            max-width: 600px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #4d5156;
            margin-top: 30px;
            padding: 10px;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #70757a;
            background-color: #f8f9fa;
        }
        @media (max-width: 768px) {
            .logo {
                max-height: 80px;
            }
            .search-box {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo">
        
        <form action="/search" method="get" class="search-box">
            <div class="input-group">
                <input required type="text" class="form-control search-input" name="q" placeholder="Buscar..." autocomplete="off" aria-label="Buscar">
            </div>
            <div class="search-buttons">
                <button type="submit" class="search-button">Buscar</button>
            </div>
        </form>
        
        <div class="info-message">
            El sistema indexa automáticamente todas las páginas HTML cada 60 segundos.
        </div>
    </div>

    <footer>
        © 2023 Buscador - Todos los derechos reservados
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
